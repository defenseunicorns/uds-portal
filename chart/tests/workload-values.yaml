nodeSelector:
  nodepool: platform
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values:
                - amd64
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: topology.kubernetes.io/zone
              operator: In
              values:
                - us-east-1a
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: uds-portal
          topologyKey: kubernetes.io/hostname
tolerations:
  - key: dedicated
    operator: Equal
    value: platform
    effect: NoSchedule
  - key: maintenance
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 300
extraEnvs:
  - name: EXTRA_LITERAL
    value: "true"
  - name: EXTRA_SECRET
    valueFrom:
      secretKeyRef:
        name: portal-api
        key: token
  - name: EXTRA_CONFIG
    valueFrom:
      configMapKeyRef:
        name: portal-config
        key: setting
  - name: EXTRA_POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
