replicaCount: 1

# Standard Kubernetes pod scheduling settings.
nodeSelector: {}
affinity: {}
tolerations: []

image:
  repository: ghcr.io/defenseunicorns/uds-portal
  tag: "0.0.0-dev"
  pullPolicy: IfNotPresent
sso:
  enabled: true
package:
  gateway: tenant
  host: portal
  domain: "uds.dev"
  adminDomain: ""

# Default requests and limits when running only uds-core (increase for production)
resources:
  requests:
    memory: "128Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "750m"

# add user and group for static chainguard image
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
containerSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532

classificationBanner:
  enabled: false
  addFooter: false
  text: ""

adminApps:
  enabled: true

# Additional Kubernetes EnvVar entries (value or valueFrom).
# Use the dedicated chart values for environment variables already set above.
# These examples configure the Go runtime used by Portal.
# extraEnvs:
#   - name: GOMEMLIMIT
#     value: 768MiB
#   - name: GOGC
#     valueFrom:
#       configMapKeyRef:
#         name: portal-runtime
#         key: gogc
extraEnvs: []

# Keep extraVolumes and extraVolumeMounts names in sync.
#
# For environments where Portal needs the UDS trust bundle, mount
# uds-trust-bundle only when it is expected in the uds-portal namespace.
# Omitting optional makes the pod wait for the ConfigMap before starting.
#
# extraVolumes:
#   - name: ca-certs
#     configMap:
#       name: uds-trust-bundle
# extraVolumeMounts:
#   - name: ca-certs
#     mountPath: /etc/ssl/certs/ca-bundle.pem
#     subPath: ca-bundle.pem
#     readOnly: true
extraVolumes: []

extraVolumeMounts: []
